<div class="flex min-h-screen items-center justify-center bg-[#e6e9f3] p-4">
  <p-card styleClass="w-full max-w-md border border-[#e6e9f3] bg-[#FFFFFF] shadow-sm">
    <ng-template #title>
      <span class="text-xl font-semibold text-slate-800">Reset password</span>
    </ng-template>

    <div class="flex flex-col gap-4">
      @if (success) {
        <p-message
          severity="success"
          text="Password updated. Redirecting to sign in…"
          styleClass="w-full"
        />
      }
      @if (errorMessage) {
        <p-message severity="error" [text]="errorMessage" styleClass="w-full" />
      }

      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-slate-600" for="rs-token">Reset token</label>
        <input
          pInputText
          id="rs-token"
          class="w-full"
          name="token"
          [(ngModel)]="token"
          [disabled]="loading || success"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-slate-600" for="rs-new">New password</label>
        <p-password
          inputId="rs-new"
          [(ngModel)]="newPassword"
          name="newPassword"
          [feedback]="true"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
          [disabled]="loading || success"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-slate-600" for="rs-confirm">Confirm password</label>
        <p-password
          inputId="rs-confirm"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
          [disabled]="loading || success"
        />
      </div>

      <button
        pButton
        type="button"
        label="Update password"
        icon="pi pi-check"
        severity="success"
        class="w-full"
        [loading]="loading"
        [disabled]="success"
        (click)="submit()"
      ></button>

      <a routerLink="/login" class="text-center text-sm text-emerald-900 underline decoration-emerald-800/40">
        Back to sign in
      </a>
    </div>
  </p-card>
</div>
