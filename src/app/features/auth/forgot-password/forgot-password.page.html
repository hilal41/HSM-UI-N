<div class="flex min-h-screen items-center justify-center bg-[#e6e9f3] p-4">
  <p-card styleClass="w-full max-w-md border border-[#e6e9f3] bg-[#FFFFFF] shadow-sm">
    <ng-template #title>
      <span class="text-xl font-semibold text-slate-800">Forgot password</span>
    </ng-template>
    <ng-template #subtitle>
      <p class="text-sm text-slate-600">We will email reset instructions if the account exists.</p>
    </ng-template>

    <div class="flex flex-col gap-4">
      @if (errorMessage) {
        <p-message severity="error" [text]="errorMessage" styleClass="w-full" />
      }
      @if (infoMessage) {
        <p-message severity="success" [text]="infoMessage" styleClass="w-full" />
      }
      @if (debugToken) {
        <p-message
          severity="info"
          [text]="'Debug token (dev only): ' + debugToken"
          styleClass="w-full"
        />
      }

      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-slate-600" for="fp-email">Email</label>
        <input
          pInputText
          id="fp-email"
          type="email"
          class="w-full"
          name="email"
          [(ngModel)]="email"
          [disabled]="loading"
          autocomplete="email"
        />
      </div>

      <button
        pButton
        type="button"
        label="Send request"
        icon="pi pi-send"
        severity="success"
        class="w-full"
        [loading]="loading"
        (click)="submit()"
      ></button>

      <a routerLink="/login" class="text-center text-sm text-emerald-900 underline decoration-emerald-800/40">
        Back to sign in
      </a>
    </div>
  </p-card>
</div>
