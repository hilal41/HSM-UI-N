<app-surface-panel title="Change password">
  <div class="flex max-w-lg flex-col gap-4">
    @if (errorMessage) {
      <p-message severity="error" [text]="errorMessage" styleClass="w-full" />
    }

    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-slate-600" for="cp-current">Current password</label>
      <p-password
        inputId="cp-current"
        [(ngModel)]="currentPassword"
        name="currentPassword"
        [feedback]="false"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full"
        [disabled]="loading"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-slate-600" for="cp-new">New password</label>
      <p-password
        inputId="cp-new"
        [(ngModel)]="newPassword"
        name="newPassword"
        [feedback]="true"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full"
        [disabled]="loading"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-slate-600" for="cp-confirm">Confirm new password</label>
      <p-password
        inputId="cp-confirm"
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        [feedback]="false"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full"
        [disabled]="loading"
      />
    </div>

    <button
      pButton
      type="button"
      label="Save password"
      icon="pi pi-save"
      severity="success"
      [loading]="loading"
      (click)="submit()"
    ></button>
  </div>
</app-surface-panel>
