<app-surface-panel class="hms-crud-surface" title="Roles" subtitle="System and custom permission sets">
  <div surfacePanelActions class="hms-crud-actions">
    <button
      pButton
      type="button"
      label="New role"
      icon="pi pi-plus"
      severity="secondary"
      class="hms-toolbar-solid"
      (click)="openCreate()"
    ></button>
  </div>

  <div class="hms-crud-body-spacer" aria-hidden="true"></div>
  <div class="hms-crud-panel-body">
  @if (errorMessage) {
    <p-message severity="error" [text]="errorMessage" styleClass="mb-4 w-full" />
  }
  <p-table
    [showLoader]="false"
    [value]="rows"
    [loading]="loading"
    [tableStyle]="{ 'min-width': '100%' }"
    styleClass="p-datatable-sm hms-crud-table"
    [paginator]="showPaginator"
    [alwaysShowPaginator]="false"
    [rows]="15"
  >
    <ng-template #header>
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>System</th>
        <th class="w-32 text-end">Actions</th>
      </tr>
    </ng-template>
    <ng-template #body let-row>
      <tr>
        <td class="font-medium text-slate-800">{{ row.name }}</td>
        <td class="text-sm text-slate-600">{{ row.description ?? '—' }}</td>
        <td>
          <p-tag
            [value]="row.isSystemRole ? 'System' : 'Custom'"
            [severity]="row.isSystemRole ? 'success' : 'secondary'"
          />
        </td>
        <td class="text-end">
          <div class="flex justify-end gap-1">
            <button
              pButton
              type="button"
              icon="pi pi-pencil"
              [text]="true"
              severity="secondary"
              (click)="openEdit(row)"
              title="Edit role"
              aria-label="Edit role"
            ></button>
            <button
              pButton
              type="button"
              icon="pi pi-trash"
              [text]="true"
              severity="danger"
              [disabled]="row.isSystemRole"
              (click)="confirmDelete(row)"
              title="Delete role"
              aria-label="Delete role"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="4" class="hms-table-empty-cell hms-table-empty-cell--crud">
          <app-hms-crud-empty-state
            icon="pi pi-shield"
            title="No roles yet"
            description="Define permission sets for doctors, nurses, cashiers, and admin staff."
            [actionable]="true"
            actionLabel="Click to add a role"
            (action)="openCreate()"
          />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="loadingbody" let-columns>
      <app-hms-table-loading-body [cols]="columns?.length || 4" />
    </ng-template>
  </p-table>
  </div>
</app-surface-panel>
