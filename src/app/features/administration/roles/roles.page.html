<app-surface-panel class="hms-crud-surface" title="Roles" subtitle="System and custom permission sets">
  <div class="hms-crud-body-spacer" aria-hidden="true"></div>
  <div class="hms-crud-panel-body">
  @if (errorMessage) {
    <p-message severity="error" [text]="errorMessage" styleClass="mb-4 w-full" />
  }
  <p-table
    [showLoader]="false"
    [value]="rows"
    [loading]="loading"
    [tableStyle]="{ 'min-width': '100%' }"
    styleClass="p-datatable-sm"
    [paginator]="true"
    [rows]="15"
  >
    <ng-template #header>
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>System</th>
        <th class="w-24 text-end">View</th>
      </tr>
    </ng-template>
    <ng-template #body let-row>
      <tr>
        <td class="font-medium text-slate-800">{{ row.name }}</td>
        <td class="text-sm text-slate-600">{{ row.description ?? '—' }}</td>
        <td>
          <p-tag
            [value]="row.isSystemRole ? 'System' : 'Custom'"
            [severity]="row.isSystemRole ? 'success' : 'secondary'"
          />
        </td>
        <td class="text-end">
          <button
            pButton
            type="button"
            icon="pi pi-eye"
            [text]="true"
            severity="secondary"
            (click)="openDetail(row)"
            title="GET by id"
            aria-label="View role"
          ></button>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="4" class="hms-table-empty-cell text-center text-sm text-slate-500">
          <div class="flex flex-col items-center justify-center gap-2 py-4">
            <i class="pi pi-inbox text-4xl text-slate-300" aria-hidden="true"></i>
            <span>No roles found.</span>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="loadingbody" let-columns>
      <app-hms-table-loading-body [cols]="columns?.length || 4" />
    </ng-template>
  </p-table>
  </div>
</app-surface-panel>

<p-dialog
  header="Role detail"
  [(visible)]="detailOpen"
  [modal]="true"
  [style]="{ width: 'min(95vw, 28rem)' }"
  [contentStyle]="{ overflow: 'hidden', padding: '0' }"
  styleClass="hms-crud-dialog"
  (onHide)="closeDetail()"
>
  <div class="hms-dialog-body">
    <div class="hms-dialog-scroll">
  @if (detailLoading) {
    <app-hms-block-skeleton [lines]="10" ariaLabel="Loading role detail" />
  } @else if (roleDetail) {
    <dl class="grid grid-cols-1 gap-3 text-sm sm:grid-cols-2">
      <div>
        <dt class="text-xs font-medium text-slate-500">ID</dt>
        <dd class="font-mono text-slate-800">{{ roleDetail.id }}</dd>
      </div>
      <div>
        <dt class="text-xs font-medium text-slate-500">Name</dt>
        <dd class="text-slate-800">{{ roleDetail.name }}</dd>
      </div>
      <div class="sm:col-span-2">
        <dt class="text-xs font-medium text-slate-500">Description</dt>
        <dd class="text-slate-800">{{ roleDetail.description ?? '—' }}</dd>
      </div>
      <div class="sm:col-span-2">
        <dt class="text-xs font-medium text-slate-500">System role</dt>
        <dd>
          <p-tag
            [value]="roleDetail.isSystemRole ? 'Yes' : 'No'"
            [severity]="roleDetail.isSystemRole ? 'success' : 'secondary'"
          />
        </dd>
      </div>
    </dl>
  }
    </div>
  </div>
  <ng-template #footer>
    <button pButton type="button" label="Close" severity="secondary" (click)="closeDetail()"></button>
  </ng-template>
</p-dialog>
