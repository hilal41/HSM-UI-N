<app-surface-panel class="hms-crud-surface" title="Stock" subtitle="On-hand quantity by medicine (branch stock)">
  <div surfacePanelActions class="hms-crud-actions">
    <input pInputText [(ngModel)]="searchInput" placeholder="Search…" (keyup.enter)="onLazyLoad({ first: 0, rows: pageSize })" />
    <label class="flex items-center gap-2 text-sm">
      <input type="checkbox" [(ngModel)]="lowStockOnly" (change)="onLazyLoad({ first: 0, rows: pageSize })" />
      Low stock only
    </label>
    <button pButton type="button" icon="pi pi-search" [outlined]="true" (click)="onLazyLoad({ first: 0, rows: pageSize })"></button>
  </div>
  <div class="hms-crud-body-spacer" aria-hidden="true"></div>
  <div class="hms-crud-panel-body">
    <p-table
      [value]="rows"
      [lazy]="true"
      [paginator]="showPaginator"
      [alwaysShowPaginator]="false"
      [rows]="tablePageSize"
      [totalRecords]="totalCount"
      [loading]="loading"
      [showLoader]="false"
      (onLazyLoad)="onLazyLoad($event)"
      styleClass="p-datatable-sm hms-crud-table"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Code</th>
          <th>Medicine</th>
          <th>Unit</th>
          <th>On hand</th>
          <th>Reorder</th>
          <th></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row>
        <tr>
          <td class="font-mono text-sm">{{ row.medicineCode }}</td>
          <td>{{ row.medicineName }}</td>
          <td>{{ row.unit || '—' }}</td>
          <td>
            {{ row.qtyOnHand }}
            @if (row.isLowStock) {
              <p-tag value="Low" severity="warn" class="ml-2" />
            }
          </td>
          <td>{{ row.reorderLevel ?? '—' }}</td>
          <td class="text-right">
            <button pButton type="button" label="Batches" class="p-button-text" (click)="openBatches(row)"></button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="hms-table-empty-cell hms-table-empty-cell--crud">
            <app-hms-crud-empty-state
              icon="pi pi-box"
              title="No stock yet"
              description="Receive goods from Purchases to add inventory batches."
            />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</app-surface-panel>

<p-dialog [(visible)]="batchesOpen" [header]="'Batches — ' + selectedMedicineName" [modal]="true" [style]="{ width: '40rem' }">
  <p-table [value]="batches" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr><th>Batch</th><th>Expiry</th><th>Qty</th><th>Sale</th><th></th></tr>
    </ng-template>
    <ng-template pTemplate="body" let-b>
      <tr>
        <td>{{ b.batchNumber }}</td>
        <td>{{ b.expiryDate }}</td>
        <td>{{ b.qtyOnHand }}</td>
        <td>{{ b.salePrice }}</td>
        <td><button pButton type="button" label="Adjust" class="p-button-text" (click)="openAdjust(b)"></button></td>
      </tr>
    </ng-template>
  </p-table>
</p-dialog>

<p-dialog [(visible)]="adjustOpen" header="Adjust stock" [modal]="true" [style]="{ width: '24rem' }">
  <div class="flex flex-col gap-3">
    <p-inputNumber [(ngModel)]="adjustQty" [showButtons]="true" placeholder="Qty delta (+/-)" />
    <input pInputText [(ngModel)]="adjustReason" placeholder="Reason" />
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancel" class="p-button-text" (click)="adjustOpen = false"></button>
    <button pButton type="button" label="Save" [loading]="adjusting" (click)="saveAdjust()"></button>
  </ng-template>
</p-dialog>
