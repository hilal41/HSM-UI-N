<app-surface-panel title="Dashboard">
  <div class="grid pt-[var(--hms-main-pad)] gap-[var(--hms-main-pad)] sm:grid-cols-2 xl:grid-cols-3">
  @for (card of quickLinks; track card.route) {
    <a
      [routerLink]="card.route"
      class="block rounded-xl border border-[#e6e9f3] bg-[#FFFFFF] shadow-sm transition hover:border-emerald-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-800"
    >
      <p-card styleClass="border-0 shadow-none">
        <ng-template #title>
          <div class="flex items-center gap-2">
            <i [class]="card.icon + ' text-lg text-emerald-800'" aria-hidden="true"></i>
            <span class="text-base font-semibold text-slate-800">{{ card.title }}</span>
          </div>
        </ng-template>
        <p class="m-0 text-sm text-slate-600">{{ card.description }}</p>
      </p-card>
    </a>
  }
  </div>
</app-surface-panel>
